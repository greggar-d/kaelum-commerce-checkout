[project]
name = "kaelum-commerce-checkout"
version = "0.1.0"
description = "KAELUM storefront backend for the anthropics/commerce-agents shopping agent."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kaelum_storefront"]

[tool.ruff]
line-length = 100
